name: Update SLTDA data

on:
  schedule:
    # 08:47 Sri Lanka time on the 1st, 5th and 10th.
    - cron: '17 3 1,5,10 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sltda-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-data.txt
      - name: Download and validate SLTDA tables
        run: python src/update_data.py
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- data/; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          cat .sltda-downloads/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Refit candidate model
        if: steps.changes.outputs.changed == 'true'
        run: python src/train_model.py
      - name: Check data, history, model and app
        run: python -m unittest discover -s tests -v
      - name: Save source files and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sltda-source-${{ github.run_id }}
          path: .sltda-downloads/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
      - name: Open or update data pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automated/sltda-update
          previous=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          git switch -C "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/Tourism_Arrivals.csv data/source_manifest.json models/deployment_model.joblib models/model_info.json
          git commit -m 'Update SLTDA data and candidate model'
          git push --force-with-lease="refs/heads/$branch:$previous" origin "HEAD:refs/heads/$branch"
          cat .sltda-downloads/summary.md > /tmp/sltda-pr.md
          echo >> /tmp/sltda-pr.md
          echo "Source files and validation report: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> /tmp/sltda-pr.md
          echo >> /tmp/sltda-pr.md
          echo 'The candidate model uses the existing settings and updated history. Validation scores in the notebook remain historical. Review this update before merging; Azure still requires production approval.' >> /tmp/sltda-pr.md
          pr=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title 'Update SLTDA arrivals data' --body-file /tmp/sltda-pr.md
          else
            gh pr create --base main --head "$branch" --title 'Update SLTDA arrivals data' --body-file /tmp/sltda-pr.md
          fi
          # Explicit dispatch also works for branches pushed by GITHUB_TOKEN.
          gh workflow run checks.yml --ref "$branch"
