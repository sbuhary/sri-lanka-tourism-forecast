name: Build forecast container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - app.py
      - requirements.txt
      - deployment_model.joblib
      - model_info.json
      - infra/**
      - .github/workflows/container.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check infrastructure syntax
        run: az bicep build --file infra/main.bicep --outfile /tmp/azure.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Check container startup and model
        run: |
          image=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker run --rm "$image" python -c "import joblib,json,pandas as pd; i=json.load(open('model_info.json')); m=joblib.load('deployment_model.joblib'); p=m.predict(pd.DataFrame([i['default_inputs']])[i['features']])[0]; assert abs(p-50521.55)<0.05; print('Model prediction verified')"
          docker run -d --name forecast -p 8501:8501 "$image"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health
          docker logs forecast
          docker stop forecast
      - name: Publish tested image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
