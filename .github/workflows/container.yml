name: Build and deploy forecast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - app.py
      - assets/**
      - .streamlit/config.toml
      - src/train_model.py
      - src/forecast_inputs.py
      - data/Tourism_Arrivals.csv
      - tests/**
      - .github/workflows/checks.yml
      - requirements.txt
      - requirements-data.txt
      - models/deployment_model.joblib
      - models/model_info.json
      - models/evaluation_results.json
      - infra/**
      - .github/workflows/container.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  model-check:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.published.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check infrastructure syntax
        run: az bicep build --file infra/main.bicep --outfile /tmp/azure.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Check container startup and model
        run: |
          image=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker run --rm "$image" python -c "import joblib,json,pandas as pd; i=json.load(open('models/model_info.json')); m=joblib.load('models/deployment_model.joblib'); p=m.predict(pd.DataFrame([i['default_inputs']])[i['features']])[0]; assert p>=0 and abs(p-i['deployment_default_prediction'])<0.000001; print('Model prediction verified')"
          docker run --rm "$image" python -c "from streamlit.testing.v1 import AppTest; a=AppTest.from_file('app.py').run(timeout=60); assert not a.exception; assert len(a.metric)==1; print('App and bundled data verified')"
          docker run -d --name forecast -p 8501:8501 "$image"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health
          docker logs forecast
          docker stop forecast
      - name: Publish tested image
        id: published
        run: |
          image=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          echo "image=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [model-check, build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.release.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy tested image
        id: release
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          REGION: ${{ vars.AZURE_REGION }}
        run: |
          url=$(az deployment group create --resource-group "$RESOURCE_GROUP" \
            --name "release-${GITHUB_RUN_ID}" --template-file infra/main.bicep \
            --parameters location="$REGION" image="$IMAGE" \
            --query properties.outputs.appUrl.value --output tsv)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Check live health
        env:
          APP_URL: ${{ steps.release.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 10 --max-time 30 "$APP_URL/_stcore/health"
          echo "### Azure release" >> "$GITHUB_STEP_SUMMARY"
          echo "App: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ needs.build.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Live health check passed." >> "$GITHUB_STEP_SUMMARY"
